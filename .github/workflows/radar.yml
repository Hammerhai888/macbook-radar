name: DACH MacBook Air 15 Radar

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Browser installieren
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Alle 46 Shops durchsuchen
        run: python scraper.py

      - name: Gemeldete Deals speichern
        run: |
          git config user.name "PriceRadarBot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_deals.json || true
          git commit -m "Update seen deals" || exit 0
          git push
